# Grafana dashboard provisioning — load every dashboard JSON mounted under
# /var/lib/grafana/dashboards (see docker-compose `lab-grafana` volume).
apiVersion: 1

providers:
  - name: shieldtest-lab
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
