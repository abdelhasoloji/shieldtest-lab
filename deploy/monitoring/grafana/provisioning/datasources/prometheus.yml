# Grafana datasource provisioning — the lab's Prometheus, reached over the
# private `monitoring` bridge network by its Compose service name.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: shieldtest-prometheus
    type: prometheus
    access: proxy
    url: http://lab-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
