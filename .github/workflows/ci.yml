name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Zero-dependency lint: every .mjs must at least parse. Cheap guard that a
      # syntax error can never reach main even before the test suite runs.
      - name: Syntax check (node --check)
        run: |
          set -e
          find . -name '*.mjs' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
      # Safety-invariant suite (caps hold under fuzzing, the net-guard refuses
      # anything outside the lab CIDR, closed-loop detection/mitigation). Pure
      # Node — no Docker, no install.
      - name: Test
        run: node --test "test/*.test.mjs"

  compose:
    runs-on: ubuntu-latest
    name: compose config validation
    steps:
      - uses: actions/checkout@v7
      # Catch drift in docker-compose.yml and the opt-in monitoring profile
      # without building or running any image.
      - name: Validate base compose
        run: docker compose config -q
      - name: Validate base + monitoring profile
        run: docker compose --profile monitoring config -q

  smoke:
    runs-on: ubuntu-latest
    name: observability smoke test
    steps:
      - uses: actions/checkout@v7
      # Actually builds and runs the images (target + reflector + Prometheus)
      # and asserts Prometheus scrapes live lab metrics. This is the only job
      # that exercises the Dockerfiles at runtime — `node --test` never does —
      # so it catches image regressions (missing COPY, unreadable perms) that
      # config validation alone cannot.
      - name: Run observability smoke test
        run: bash deploy/monitoring/smoke.sh
